<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Exit Status - A game to teach the CLI</title>
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
        <link rel="manifest" href="/site.webmanifest">
        <script>
            (function () {
                var saved = null;
                try { saved = localStorage.getItem("theme"); } catch (e) {}
                var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
                document.documentElement.classList.toggle("dark", dark);
            })();
        </script>
    </head>
    <body class="bg-gray-100 text-gray-900 dark:bg-neutral-950 dark:text-gray-200">
        <div class="flex items-start justify-center gap-4 p-4">
            <div id="screen_wrap" class="relative shrink-0">
                <div id="screen_container">
                    <div></div>
                    <canvas style="display: none"></canvas>
                </div>
            </div>
            <aside id="button_panel" class="flex w-56 shrink-0 flex-col gap-3">
                <div id="buttons"></div>
                <p id="panel_note" class="text-xs leading-relaxed text-gray-400">
                Files you upload or create live in memory and are lost on reload. If you want files to persist, download a save state and restore it. Files may be drag-and-dropped onto the terminal to upload them to /home/user.
                </p>
            </aside>
        </div>
        <script type="module" src="/src/main.js"></script>
        <footer class="mx-auto max-w-md">Exit Status &copy; 2026 runs on the amazing <a href="https://github.com/copy/v86">v86</a> library.</footer>
    </body>
</html>
